<html>
    <head>
        <title>form</title>
    </head>
    <body>
        <form>
            <fieldset>
            <legend>Student Registration Form</legend><br><br>
            <label>Student Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label>Email:</label>
            <input type="email" id="email" name="email"><br><br>
            <label>password:</label>
            <input type="password" id="password" name="password"><br><br>
            <label>mobile number:</label>
            <input type="tel" id="mobile" name="mobile"> <br><br>
            <label>Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>
            <label>course:</label>
            <select>
                <option> select course</option>
                <option> python full stack</option>
                <option> java full stack</option>
                <option> data science</option>
            </select><br><br>
            <label>Skills:</label>
            <label>python</label>
            <input type="checkbox" value="python" name="skills">
            <label>java</label>
            <input type="checkbox" value="java" name="skills">
            <label>sql</label>
            <input type="checkbox" value="sql" name="skills"><br><br>
            <label>Address:</label>
            <textarea id="address" name="address"></textarea><br><br>
            <label>City:</label>
            <select>
                <option> select city</option>
                <option> chennai</option>
                <option> bangalore</option>
                <option> hyderabad</option>
            </select><br><br>
            <label>State:</label>
            <select>
                <option> select state</option>
                <option> Andhra pradesh</option>
                <option> karnataka</option>
                <option> telangana</option>
                <option> tamil nadu</option>
            </select><br><br>
            <input type="submit" value="submit"><br><br>
            <input type="Reset" value="reset"><br><br>
            </fieldset>
        </form>
    </body>
</html>
